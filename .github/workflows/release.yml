# Releases VERSION: builds the prebuilt core (Apple xcframeworks, the
# Android AAR) and the Windows and Linux plugins' FFmpeg, pins their SHA-256s in
# flutter/prebuilt.json and Package.swift, checks that a fresh app builds with the package pub would
# publish (macOS, iOS and Android on macOS, Windows and both Linux
# architectures on their native runners), attests
# the assets' build provenance and an SPDX SBOM of them (also an asset),
# drafts the GitHub release with the assets, and pushes the
# "Release VERSION" commit and the tag vVERSION. The tag starts publish.yml,
# which publishes the release, the pub.dev package and both Android AARs
# on Maven Central.
#
#   gh workflow run release.yml -f version=1.0.0
#
# flutter/CHANGELOG.md must have a "## VERSION" section; it becomes the
# release notes. The push needs RELEASE_DEPLOY_KEY, the private half of a
# deploy key with write access: a push with the workflow's own token would
# not start publish.yml.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, as in pubspec.yaml (1.0.0)
        required: true

concurrency: release

env:
  VERSION: ${{ inputs.version }}

jobs:
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: brew install meson nasm ninja pkg-config
      - run: tool/release.sh version "$VERSION"
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/apple_framework.sh tool/patches/*.patch; grep -E '^(ffmpeg|dav1d)_' tool/release.sh; xcodebuild -version)"
          echo "key=ffmpeg-apple-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - run: tool/release.sh build apple build-sources
      # Nothing is released unless the media matrix plays through the
      # FFmpeg that ships. Read a red run's log before dispatching again.
      - name: Regression with the shipped FFmpeg
        # Homebrew's ffmpeg only generates the media; installed after the
        # shipped FFmpeg is built, so that build cannot find it. A hosted VM
        # is loaded: the realtime cases' timing only warns, as in ci.yml.
        run: |
          brew install ffmpeg pkg-config
          REALTIME_ADVISORY=1 NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/macos-arm64 tool/regression.sh
      - run: tool/release.sh pack apple dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: dist
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install tools
        run: sudo apt-get install -y meson ninja-build pkg-config
      - run: tool/release.sh version "$VERSION"
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/patches/*.patch; grep -E '^(ffmpeg|dav1d)_' tool/release.sh; echo "$ANDROID_NDK_HOME")"
          echo "key=ffmpeg-android-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - run: tool/release.sh build android build-sources
      - run: tool/release.sh pack android dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist
          if-no-files-found: error

  # The Windows plugin's FFmpeg, cross-compiled with mingw-w64; the plugin
  # compiles the core itself. build_ffmpeg.sh warns when the mingw-w64
  # headers lack AV1's DXVA structures (Ubuntu 22.04's do): dav1d is the fallback.
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: sudo apt-get install -y mingw-w64 libz-mingw-w64-dev nasm meson ninja-build pkg-config zip
      - run: tool/release.sh version "$VERSION"
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/patches/*.patch; grep -E '^(ffmpeg|dav1d)_' tool/release.sh; x86_64-w64-mingw32-gcc --version | head -1; dpkg -s mingw-w64-x86-64-dev | grep ^Version)"
          echo "key=ffmpeg-windows-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - run: tool/release.sh build windows build-sources
      - run: tool/release.sh pack windows dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist
          if-no-files-found: error

  # The Linux plugin's FFmpeg, on the oldest Ubuntu it supports: the
  # libraries need that glibc or newer, and link its libva, libdrm, GnuTLS
  # and zlib (tool/build_ffmpeg.sh). The plugin compiles the core itself.
  # Each architecture builds natively on its own runner.
  linux:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config meson ninja-build \
            libva-dev libdrm-dev libgnutls28-dev zlib1g-dev xz-utils
      - run: tool/release.sh version "$VERSION"
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/patches/*.patch; grep -E '^(ffmpeg|dav1d)_' tool/release.sh; lsb_release -ds; gcc --version | head -1)"
          echo "key=ffmpeg-linux-release-$(uname -m)-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - run: tool/release.sh build linux build-sources
      - run: tool/release.sh pack linux dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

  # tool/release.sh check for Windows, in Git Bash: a fresh app builds
  # with the package and downloads the release's FFmpeg. The pins are the
  # ones the release job computes from the same assets; nothing here is
  # committed.
  check-windows:
    needs: [apple, android, windows, linux]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: tool/release.sh version "$VERSION"
      - run: tool/release.sh pin dist
      - run: tool/release.sh check dist

  # Check the native Flutter plugin against the same assets on both Linux
  # runners. The release waits for these fresh-app builds before publishing.
  check-linux:
    needs: [apple, android, windows, linux]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            curl git unzip xz-utils python3 libgtk-3-dev libepoxy-dev libpng-dev libpulse-dev \
            libva-dev libdrm-dev libgnutls28-dev zlib1g-dev libstdc++-12-dev
      - name: Set up native Flutter
        # Stable Linux SDK archives are x64-only. A stable Git checkout
        # bootstraps the native Dart SDK and engine on x64 and arm64.
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: tool/release.sh version "$VERSION"
      - run: tool/release.sh pin dist
      - run: tool/release.sh check dist

  release:
    needs: [apple, android, windows, linux, check-windows, check-linux]
    runs-on: macos-26
    permissions:
      contents: write
      # The attestations: a Sigstore certificate for the workflow's
      # identity, stored with the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: tool/release.sh version "$VERSION"
      - run: tool/release.sh sources dist
      - run: tool/release.sh pin dist
      # Committed before the check, so pub packs it from a clean tree;
      # nothing leaves the runner until the push.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift flutter/pubspec.yaml flutter/prebuilt.json
          git commit -m "Release $VERSION"
      - run: tool/release.sh check dist
      # Provenance and the SBOM attest the assets the checks passed, the
      # SBOM's file aside; it joins them afterwards as an asset of its own.
      - name: SBOM
        run: |
          tool/release.sh sbom dist
          mv dist/*.spdx.json "$RUNNER_TEMP/sbom.spdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
      - run: mv "$RUNNER_TEMP/sbom.spdx.json" "dist/lychee_player-$VERSION.spdx.json"
      # Before the tag exists: publish.yml, which the tag starts, publishes
      # this draft.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool/release.sh notes >"$RUNNER_TEMP/notes.md"
          # 1.0.0-beta.1 and the like are GitHub prereleases, never "latest".
          prerelease=()
          [[ "$VERSION" != *-* ]] || prerelease=(--prerelease)
          gh release create "v$VERSION" --draft "${prerelease[@]}" --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
      - name: Tag and push
        run: |
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
