# Lists newer releases of the FFmpeg and GLFW sources pinned in
# tool/release.sh and examples/glfw (tool/check_updates.py), which
# Dependabot cannot read: in the run's summary and as notices. It opens
# no issue or pull request; updating a pin stays a change someone makes
# and checks (AGENTS.md).

name: Updates

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tool/check_updates.py --github | tee -a "$GITHUB_STEP_SUMMARY"
