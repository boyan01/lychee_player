# Publishes the tag vVERSION that release.yml pushed: the drafted GitHub
# release, then the package on pub.dev. pub.dev accepts its OIDC token only
# from a workflow a tag push started, from the environment pub.dev (the
# package's Admin page names both).

name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pub.dev
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the tag
        run: |
          grep -qx "version: ${GITHUB_REF_NAME#v}" flutter/pubspec.yaml
          grep -q "\"tag\": \"$GITHUB_REF_NAME\"" flutter/prebuilt.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Check the release's files
        run: tool/release.sh verify
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: tool/release.sh publish
