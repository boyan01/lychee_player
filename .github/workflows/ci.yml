name: CI

on:
  push:
  pull_request:

jobs:
  core-macos:
    # Hosted runners are VMs; VideoToolbox may be missing there, so decode in
    # software.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        tsan: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ffmpeg ninja pkg-config glfw
      - name: Regression
        run: NO_HW=1 TSAN=${{ matrix.tsan }} tool/regression.sh

  flutter-macos:
    # The pod links the xcframeworks; build them from this commit's core
    # with the LGPL FFmpeg, as release.yml does (same runner and cache key,
    # so a release reuses the FFmpeg builds). The regression then plays
    # the media matrix through that FFmpeg, which leaves out what the core
    # does not list (core-macos uses Homebrew's full one).
    runs-on: macos-26
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install tools
        run: brew install nasm ninja
      - name: FFmpeg cache key
        id: ffmpeg
        working-directory: .
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/apple_framework.sh; grep -E '^(ffmpeg|mbedtls)_' tool/release.sh; xcodebuild -version)"
          echo "key=ffmpeg-apple-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build the xcframeworks
        working-directory: .
        run: tool/release.sh build apple build-sources
      - name: Regression with the shipped FFmpeg
        working-directory: .
        # Homebrew's ffmpeg only generates the media; installed after the
        # shipped FFmpeg is built, so that build cannot find it.
        run: |
          brew install ffmpeg pkg-config
          NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/macos-arm64 tool/regression.sh
      - name: Analyze
        run: flutter analyze
      - name: Build example
        working-directory: flutter/example
        run: LANG=en_US.UTF-8 flutter build macos --debug
