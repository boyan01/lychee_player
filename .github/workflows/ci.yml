name: CI

on:
  push:
  pull_request:

# Each job runs only for the areas a push or pull request touches
# (tool/changes.sh; a change to this file or that script runs them all):
# the ABI check, the core on macOS and Linux, the parsers' fuzzers, the
# Apple builds and the Swift package, the Flutter plugin, the Rust crates.

env:
  # Hosted runners are loaded VMs: the realtime cases of tool/regression.sh
  # still run (the real audio sinks, slow and stalled servers), but their
  # drift, glitches and drops only warn, as an annotation.
  REALTIME_ADVISORY: 1

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.areas.outputs.core }}
      parsers: ${{ steps.areas.outputs.parsers }}
      apple: ${{ steps.areas.outputs.apple }}
      linux: ${{ steps.areas.outputs.linux }}
      abi: ${{ steps.areas.outputs.abi }}
      rust: ${{ steps.areas.outputs.rust }}
      flutter: ${{ steps.areas.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Areas
        id: areas
        # A pull request against its base; a push against the commit it
        # replaced (none for a new branch: every area).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tool/changes.sh --github "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  format:
    # clang-format on the C, C++ and Objective-C++ lines a push or pull
    # request changed; nothing when there is no base to compare with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format
        # The major version tool/format.sh names.
        run: |
          pipx install clang-format==23.1.3
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || ! git merge-base "$BASE" "$GITHUB_SHA" >/dev/null 2>&1; then
            echo "no base to compare with"
            exit 0
          fi
          tool/format.sh --check "$BASE" "$GITHUB_SHA"

  tidy:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: brew install llvm ffmpeg ninja pkg-config glfw
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then
            # A new branch has no previous commit: check all compiled core code.
            tool/tidy.sh --all
          else
            if [ "${{ github.event_name }}" = pull_request ]; then
              BASE="$(git merge-base "$BASE" "$GITHUB_SHA")"
            fi
            tool/tidy.sh "$BASE" "$GITHUB_SHA"
          fi

  abi:
    # lychee.h against the last release's and against the push's or pull
    # request's base (tool/abi_check.py): a change to its ABI, a break or an
    # addition, needs a LYCHEE_API_VERSION bump with a history line.
    needs: changes
    if: needs.changes.outputs.abi == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags.
          fetch-depth: 0
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          clang --version | head -1
          python3 -I tool/abi_check.py "$BASE"

  core-macos:
    # On pushes the plain run and TSan go to an idle self-hosted Mac: about
    # 1.5 times quicker than a hosted VM, but one at a time, so ASan stays
    # on a VM next to them. The plain run there checks the realtime cases'
    # timing (REALTIME_ADVISORY=0); under a sanitizer it stays a warning.
    # Pull requests run on hosted VMs only: the repository is public, and a
    # fork's pull request would run its code on that machine. Software
    # decoding: VideoToolbox may be missing on a VM, and VP9 on that Mac
    # hangs in it for 4 s before the player falls back to software.
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ github.event_name == 'push' && matrix.self-hosted && fromJSON('["self-hosted", "macOS", "X64", "quiet"]') || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        # ThreadSanitizer; AddressSanitizer with UndefinedBehaviorSanitizer.
        include:
          - sanitizer: none
            self-hosted: true
          - sanitizer: thread
            self-hosted: true
          - sanitizer: address
            self-hosted: false
    env:
      REALTIME_ADVISORY: ${{ github.event_name == 'push' && matrix.sanitizer == 'none' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The self-hosted Mac keeps its build directories between runs
          # (a hosted VM starts empty anyway).
          clean: false
      - name: Install tools
        if: runner.environment == 'github-hosted'
        run: brew install ffmpeg ninja pkg-config glfw
      - name: FFmpeg
        # Homebrew has no bottles for Intel Macs, so the self-hosted Mac does
        # not take its FFmpeg: the core links the LGPL one
        # tool/build_ffmpeg.sh makes (kept on the machine per script and
        # pin), and a pinned static FFmpeg 9 generates the media.
        if: runner.environment == 'self-hosted'
        run: |
          tools="$HOME/ci-tools"
          cli="$tools/ffmpeg-9.0.2"
          if [ ! -x "$cli/ffprobe" ]; then
            url=https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2
            for f in ffmpeg:7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4 \
              ffprobe:2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd; do
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/${f%%:*}.zip" "$url/${f%%:*}.zip"
              echo "${f#*:}  $RUNNER_TEMP/${f%%:*}.zip" | shasum -a 256 -c -
              unzip -oq "$RUNNER_TEMP/${f%%:*}.zip" -d "$cli"
            done
          fi
          echo "$cli" >>"$GITHUB_PATH"
          key="$({ cat tool/build_ffmpeg.sh; grep -E '^ffmpeg_' tool/release.sh; } | shasum -a 256 | cut -c1-16)"
          lib="$tools/ffmpeg-lgpl-$key"
          if [ ! -d "$lib" ]; then
            eval "$(grep -E '^ffmpeg_(version|sha256|url)=' tool/release.sh)"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$ffmpeg_url"
            echo "$ffmpeg_sha256  $RUNNER_TEMP/ffmpeg.tar.xz" | shasum -a 256 -c -
            tar xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
            rm -rf third_party/ffmpeg/macos-x86_64
            tool/build_ffmpeg.sh macos-x86_64 "$RUNNER_TEMP/ffmpeg-$ffmpeg_version"
            mv third_party/ffmpeg/macos-x86_64 "$lib"
          fi
          echo "FFMPEG_ROOT=$lib" >>"$GITHUB_ENV"
          # Media from this commit's script, not an older run's.
          echo "MEDIA_DIR=$RUNNER_TEMP/media" >>"$GITHUB_ENV"
      - name: Regression
        run: |
          NO_HW=1 TSAN=${{ matrix.sanitizer == 'thread' && 1 || 0 }} \
            ASAN=${{ matrix.sanitizer == 'address' && 1 || 0 }} tool/regression.sh

  core-linux:
    # Catches Linux build breaks without a WSL run. Software decoding: no
    # VAAPI on hosted runners. TSan stays on macOS (Linux needs clang and
    # FFmpeg suppressions, and is far slower than real time there).
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # PulseAudio for the realtime cases: with no sound card it plays to
        # a null sink (auto_null) clocked by the system, so they exercise
        # the core's PulseAudio sink. nasm, libva, GnuTLS and zlib for the
        # FFmpeg build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm \
            libva-dev libdrm-dev libgnutls28-dev zlib1g-dev libpulse-dev pulseaudio
      # The core follows the current FFmpeg API, which apt's (6.1) predates:
      # build the one tool/build_ffmpeg.sh makes for the Linux plugin.
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh; grep -E '^ffmpeg_' tool/release.sh; lsb_release -ds; gcc --version | head -1)"
          echo "key=ffmpeg-linux-$(echo "$inputs" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/linux-x86_64
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build FFmpeg
        run: tool/release.sh build linux build-sources
      - name: FFmpeg for the test media
        # Only generates the media, like Homebrew's on macOS: a GPL build
        # with x264, x265 and SVT-AV1, from the BtbN release the Linux
        # plugin pins.
        run: |
          name=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/$name.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >>"$GITHUB_PATH"
      - name: Sound server
        # An idle null sink renders 2 s ahead, so a new stream would start
        # ~2 s late (a device starts within its latency) and the realtime
        # cases would see that as drift. A silent stream at 20 ms keeps it
        # rendering in small blocks.
        run: |
          pulseaudio --start --exit-idle-time=-1
          nohup pacat --latency-msec=20 /dev/zero >/dev/null 2>&1 &
          pactl info | grep -E '^(Server Version|Default Sink)'
      - name: Regression
        run: NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/linux-x86_64 tool/regression.sh

  fuzz:
    # The FFmpeg-free parsers under libFuzzer with ASan and UBSan
    # (tool/fuzz.sh): the inputs they once crashed on, then a minute of
    # each target. The fuzz project builds the parsers alone, which use no
    # Apple API, so Linux fuzzes what the Apple builds without FFmpeg
    # parse. apt's FFmpeg only makes the seeds.
    needs: changes
    if: needs.changes.outputs.parsers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build ffmpeg
      # The corpus each run grew (build-fuzz/corpus), so a minute goes on
      # from where the last run stopped rather than from the seeds. A
      # cache cannot be overwritten: each run saves its own, also when it
      # found a crash, and the next restores the newest.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        run: LLVM=/usr/lib/llvm-18 JOBS=2 FUZZ_SECONDS=60 tool/fuzz.sh
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build-fuzz/artifacts
          if-no-files-found: ignore

  apple:
    # The pod and the Swift package link the xcframeworks; build them from
    # this commit's core with the LGPL FFmpeg, as release.yml does (same
    # runner and cache key, so a release reuses the FFmpeg builds). This is
    # the only job that compiles the core for iOS. The regression then
    # plays the media matrix through that FFmpeg, which leaves out what the
    # core does not list (core-macos uses Homebrew's full one); swift test
    # plays through the Swift package's frame driver. The Flutter steps run
    # only for changes to the plugin.
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true' ||
      needs.changes.outputs.flutter == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: needs.changes.outputs.flutter == 'true'
        with:
          channel: stable
      - name: Install tools
        run: brew install nasm ninja pkg-config
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/apple_framework.sh; grep -E '^(ffmpeg|mbedtls)_' tool/release.sh; xcodebuild -version)"
          echo "key=ffmpeg-apple-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build the xcframeworks
        run: tool/release.sh build apple build-sources
      - name: Regression with the shipped FFmpeg
        # Homebrew's ffmpeg only generates the media; installed after the
        # shipped FFmpeg is built, so that build cannot find it.
        run: |
          brew install ffmpeg pkg-config
          NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/macos-arm64 tool/regression.sh
      - name: Swift package
        working-directory: sdk/apple
        run: swift test
      - name: Analyze
        if: needs.changes.outputs.flutter == 'true'
        working-directory: flutter
        run: flutter analyze
      - name: Build example
        if: needs.changes.outputs.flutter == 'true'
        working-directory: flutter/example
        run: LANG=en_US.UTF-8 flutter build macos --debug

  rust:
    # The crates build the core themselves (Homebrew's FFmpeg) and play
    # the media regression.sh generates.
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.abi == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ffmpeg ninja pkg-config
      - name: Media
        working-directory: .
        run: MEDIA_ONLY=1 tool/regression.sh
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Docs
        run: cargo doc --no-deps
