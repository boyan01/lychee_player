name: Android emulator rendering comparison

on:
  push:
    branches: [ci/android-emulator-rendering-check]

jobs:
  android:
    # The SDK (the AAR with its FFmpeg, as release.yml builds it) and its
    # example, then on an x86_64 emulator tool/android_check.sh: the core's
    # unit tests cross-built with the NDK, and snapshots of the example
    # playing in software and through MediaCodec, checked by pixels.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader_indirect, swiftshader]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install tools
        # meson builds dav1d into FFmpeg (tool/build_ffmpeg.sh).
        run: sudo apt-get install -y meson ninja-build pkg-config
      - name: Install Android CLI and pinned emulator
        # Use the versioned CLI itself, not its auto-updating launcher.
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/android" \
            https://dl.google.com/android/cli/1.1.16717390/linux_x86_64/android-cli
          echo "b34ed0baeeffa2aaee2720d82491b975835696e2e56840449078bec885436564  $RUNNER_TEMP/android" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/android"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/android" --version
          "$RUNNER_TEMP/android" sdk install cmdline-tools/23.0
          "$RUNNER_TEMP/android" sdk install --force emulator@37.2.13
          "$RUNNER_TEMP/android" sdk install 'system-images/android-34/google_apis/x86_64@14.0.0'
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/patches/*.patch; grep -E '^(ffmpeg|dav1d)_' tool/release.sh; echo "$ANDROID_NDK_HOME")"
          echo "key=ffmpeg-android-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build the AAR
        run: tool/release.sh build android build-sources
      - name: Build the example
        run: sdk/android/gradlew -p sdk/android :example:assembleDebug
      - name: FFmpeg for the test media
        # Generates the media and the references tool/frame_check.py
        # compares with: the BtbN release core-linux takes.
        run: |
          name=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/$name.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >>"$GITHUB_PATH"
      - name: Media
        run: MEDIA_ONLY=1 tool/regression.sh
      - name: KVM
        # The emulator needs hardware acceleration, which hosted Linux
        # runners have but do not open to the runner's user.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create emulator
        # The unified CLI's create command chooses its own system image;
        # avdmanager keeps the API 34 image our pixel checks use.
        run: |
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/23.0/bin/avdmanager" create avd --force --name lychee_api34 \
            --package 'system-images;android-34;google_apis;x86_64'
          config="$HOME/.android/avd/lychee_api34.avd/config.ini"
          sed -i '/^hw.gpu./d; /^hw.cpu.ncore=/d' "$config"
          printf '%s\n' hw.cpu.ncore=2 hw.gpu.enabled=yes hw.gpu.mode=${{ matrix.gpu }} >>"$config"
      - name: Emulator rendering comparison
        run: |
          failed=0
          for round in 1 2 3; do
            output="$RUNNER_TEMP/emulator-check/${{ matrix.gpu }}/round-$round"
            mkdir -p "$output"
            android emulator start --headless --cold lychee_api34
            test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
            for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
              adb -s emulator-5554 shell settings put global "$setting" 0
            done
            if ! ANDROID_SERIAL=emulator-5554 tool/android_check.sh 2>&1 | tee "$output/check.log"; then
              failed=1
            fi
            cp -R build-android-x86_64/snapshots "$output/"
            android emulator stop lychee_api34
            cp "$HOME/.android/lychee_api34/emulator.log" "$output/emulator.log"
          done
          exit "$failed"
      - name: Stop emulator
        if: always()
        run: |
          if command -v android >/dev/null; then
            android emulator stop lychee_api34
          fi
      - name: Android snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-snapshots-${{ matrix.gpu }}
          path: |
            ${{ runner.temp }}/emulator-check
            ~/.android/lychee_api34/emulator.log
          if-no-files-found: ignore

