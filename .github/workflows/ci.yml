name: CI

on:
  push:
  pull_request:

# Each job runs only for the areas a push or pull request touches
# (tool/changes.sh; a change to this file or that script runs them all):
# the ABI check, the core on macOS, Linux and Windows, the parsers'
# fuzzers, the Apple builds and the Swift package, the Android SDK on an
# emulator, the Flutter plugin, the Rust crates.

env:
  # Hosted runners are loaded VMs: the realtime cases of tool/regression.sh
  # still run (the real audio sinks, slow and stalled servers), but their
  # drift, glitches and drops only warn, as an annotation.
  REALTIME_ADVISORY: 1

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.areas.outputs.core }}
      parsers: ${{ steps.areas.outputs.parsers }}
      apple: ${{ steps.areas.outputs.apple }}
      android: ${{ steps.areas.outputs.android }}
      windows: ${{ steps.areas.outputs.windows }}
      linux: ${{ steps.areas.outputs.linux }}
      abi: ${{ steps.areas.outputs.abi }}
      rust: ${{ steps.areas.outputs.rust }}
      flutter: ${{ steps.areas.outputs.flutter }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Areas
        id: areas
        # A pull request against its base; a push against the commit it
        # replaced (none for a new branch: every area).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tool/changes.sh --github "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  format:
    # clang-format on the C, C++ and Objective-C++ lines a push or pull
    # request changed; nothing when there is no base to compare with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: clang-format
        # The major version tool/format.sh names.
        run: |
          pipx install clang-format==23.1.3
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || ! git merge-base "$BASE" "$GITHUB_SHA" >/dev/null 2>&1; then
            echo "no base to compare with"
            exit 0
          fi
          tool/format.sh --check "$BASE" "$GITHUB_SHA"

  tidy:
    # tool/tidy.sh on the lines a push or pull request changed, on macOS
    # (the Apple backends) and on Linux (the Linux backends and
    # examples/glfw's main_linux.cc, which macOS does not compile).
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true' ||
      needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm ffmpeg ninja pkg-config glfw
          echo "$(brew --prefix llvm)/bin" >>"$GITHUB_PATH"
      - name: Install tools
        if: runner.os == 'Linux'
        # clang-tidy from PyPI at the major version of Homebrew's LLVM on
        # macOS, so both report the same checks; its wheel names the runner
        # run-clang-tidy.py. The headers of the Linux backends and of
        # main_linux.cc's GLFW, EGL and GLES.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm \
            libva-dev libdrm-dev libgnutls28-dev zlib1g-dev libpulse-dev \
            libglfw3-dev libegl-dev libgles-dev
          pipx install clang-tidy==23.1.4
          # Ahead of the runner's /usr/bin/clang-tidy (an older LLVM).
          pipx environment --value PIPX_BIN_DIR >>"$GITHUB_PATH"
      # The core follows the current FFmpeg API, which apt's (6.1) predates:
      # the headers of the LGPL build core-linux makes (same cache key).
      - name: FFmpeg cache key
        if: runner.os == 'Linux'
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh; grep -E '^ffmpeg_' tool/release.sh; lsb_release -ds; gcc --version | head -1)"
          echo "key=ffmpeg-linux-$(echo "$inputs" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.os == 'Linux'
        with:
          path: third_party/ffmpeg/linux-x86_64
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build FFmpeg
        if: runner.os == 'Linux'
        run: |
          tool/release.sh build linux build-sources
          # A compile database from clang, which clang-tidy reads as its own.
          printf '%s\n' FFMPEG_ROOT=third_party/ffmpeg/linux-x86_64 CC=clang CXX=clang++ >>"$GITHUB_ENV"
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then
            # A new branch has no previous commit: check all compiled core code.
            tool/tidy.sh --all
          else
            if [ "${{ github.event_name }}" = pull_request ]; then
              BASE="$(git merge-base "$BASE" "$GITHUB_SHA")"
            fi
            if git diff --name-only "$BASE" "$GITHUB_SHA" -- .clang-tidy tool/tidy.sh | grep -q .; then
              tool/tidy.sh --all
            else
              tool/tidy.sh "$BASE" "$GITHUB_SHA"
            fi
          fi

  abi:
    # lychee.h against the last release's and against the push's or pull
    # request's base (tool/abi_check.py): a change to its ABI, a break or an
    # addition, needs a LYCHEE_API_VERSION bump with a history line.
    needs: changes
    if: needs.changes.outputs.abi == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release tags.
          fetch-depth: 0
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          clang --version | head -1
          python3 -I tool/abi_check.py "$BASE"

  core-macos:
    # Hosted VMs are loaded, so the realtime cases' timing only warns
    # (REALTIME_ADVISORY=1). Software decoding: VideoToolbox may be missing
    # on a VM.
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # ThreadSanitizer; AddressSanitizer with UndefinedBehaviorSanitizer.
        sanitizer: [none, thread, address]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: brew install ffmpeg ninja pkg-config glfw
      - name: Regression
        run: |
          NO_HW=1 TSAN=${{ matrix.sanitizer == 'thread' && 1 || 0 }} \
            ASAN=${{ matrix.sanitizer == 'address' && 1 || 0 }} tool/regression.sh

  core-linux:
    # Catches Linux build breaks without a WSL run. Software decoding: no
    # VAAPI on hosted runners. TSan stays on macOS (Linux needs clang and
    # FFmpeg suppressions, and is far slower than real time there).
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        # PulseAudio for the realtime cases: with no sound card it plays to
        # a null sink (auto_null) clocked by the system, so they exercise
        # the core's PulseAudio sink. nasm, libva, GnuTLS and zlib for the
        # FFmpeg build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm \
            libva-dev libdrm-dev libgnutls28-dev zlib1g-dev libpulse-dev pulseaudio
      # The core follows the current FFmpeg API, which apt's (6.1) predates:
      # build the one tool/build_ffmpeg.sh makes for the Linux plugin.
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh; grep -E '^ffmpeg_' tool/release.sh; lsb_release -ds; gcc --version | head -1)"
          echo "key=ffmpeg-linux-$(echo "$inputs" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg/linux-x86_64
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build FFmpeg
        run: tool/release.sh build linux build-sources
      - name: FFmpeg for the test media
        # Only generates the media, like Homebrew's on macOS: a GPL build
        # with x264, x265 and SVT-AV1, from the BtbN release the Linux
        # plugin pins.
        run: |
          name=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/$name.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >>"$GITHUB_PATH"
      - name: Sound server
        # An idle null sink renders 2 s ahead, so a new stream would start
        # ~2 s late (a device starts within its latency) and the realtime
        # cases would see that as drift. A silent stream at 20 ms keeps it
        # rendering in small blocks.
        run: |
          pulseaudio --start --exit-idle-time=-1
          nohup pacat --latency-msec=20 /dev/zero >/dev/null 2>&1 &
          pactl info | grep -E '^(Server Version|Default Sink)'
      - name: Regression
        run: NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/linux-x86_64 tool/regression.sh

  ffmpeg-windows:
    # The Windows plugin's FFmpeg, cross-compiled with mingw-w64 as
    # release.yml does (same runner and cache key, so a release reuses it),
    # for core-windows to link: it has no FFmpeg of its own.
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: sudo apt-get install -y mingw-w64 libz-mingw-w64-dev nasm
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh; grep -E '^ffmpeg_' tool/release.sh; x86_64-w64-mingw32-gcc --version | head -1; dpkg -s mingw-w64-x86-64-dev | grep ^Version)"
          echo "key=ffmpeg-windows-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - run: tool/release.sh build windows build-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-windows-x86_64
          path: third_party/ffmpeg/windows-x86_64
          if-no-files-found: error
          retention-days: 1

  core-windows:
    # The core, its unit tests, the media matrix and examples/glfw
    # (tool/regression.sh builds every target) with MSVC in Git Bash, as
    # on the Windows PC. Software decoding: a hosted VM has no GPU, so no
    # D3D11 video decoding; its realtime cases only warn (REALTIME_ADVISORY,
    # above).
    needs: [changes, ffmpeg-windows]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ffmpeg-windows-x86_64
          path: third_party/ffmpeg/windows-x86_64
      # vcvars64's environment for the steps after it, so CMake's Ninja
      # build finds cl.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install tools
        run: command -v ninja || choco install -y --no-progress ninja
      - name: FFmpeg for the test media
        # Only generates the media: the BtbN release core-linux takes, for
        # Windows.
        run: |
          name=ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-9.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/$name.zip"
          echo "a0e45723c72141975f51d8666302e614711745f3102b704ca3f82c897a58d278  $RUNNER_TEMP/$name.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/$name/bin" >>"$GITHUB_PATH"
      - name: Regression
        run: NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/windows-x86_64 tool/regression.sh

  android:
    # The SDK (the AAR with its FFmpeg, as release.yml builds it) and its
    # example, then on an x86_64 emulator tool/android_check.sh: the core's
    # unit tests cross-built with the NDK, and snapshots of the example
    # playing in software and through MediaCodec, checked by pixels.
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install tools
        # meson builds dav1d into FFmpeg (tool/build_ffmpeg.sh).
        run: sudo apt-get install -y meson ninja-build pkg-config
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh; grep -E '^(ffmpeg|mbedtls|dav1d)_' tool/release.sh; echo "$ANDROID_NDK_HOME")"
          echo "key=ffmpeg-android-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build the AAR
        run: tool/release.sh build android build-sources
      - name: Build the example
        run: sdk/android/gradlew -p sdk/android :example:assembleDebug
      - name: FFmpeg for the test media
        # Generates the media and the references tool/frame_check.py
        # compares with: the BtbN release core-linux takes.
        run: |
          name=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/$name.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >>"$GITHUB_PATH"
      - name: Media
        run: MEDIA_ONLY=1 tool/regression.sh
      - name: KVM
        # The emulator needs hardware acceleration, which hosted Linux
        # runners have but do not open to the runner's user.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: tool/android_check.sh

  fuzz:
    # The FFmpeg-free parsers under libFuzzer with ASan and UBSan
    # (tool/fuzz.sh): the inputs they once crashed on, then a minute of
    # each target. The fuzz project builds the parsers alone, which use no
    # Apple API, so Linux fuzzes what the Apple builds without FFmpeg
    # parse. apt's FFmpeg only makes the seeds.
    needs: changes
    if: needs.changes.outputs.parsers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build ffmpeg
      # The corpus each run grew (build-fuzz/corpus), so a minute goes on
      # from where the last run stopped rather than from the seeds. A
      # cache cannot be overwritten: each run saves its own, also when it
      # found a crash, and the next restores the newest.
      - name: Restore the corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        run: LLVM=/usr/lib/llvm-18 JOBS=2 FUZZ_SECONDS=60 tool/fuzz.sh
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: build-fuzz/artifacts
          if-no-files-found: ignore

  apple:
    # The pod and the Swift package link the xcframeworks; build them from
    # this commit's core with the LGPL FFmpeg, as release.yml does (same
    # runner and cache key, so a release reuses the FFmpeg builds). This is
    # the only job that compiles the core for iOS. The regression then
    # plays the media matrix through that FFmpeg, which leaves out what the
    # core does not list (core-macos uses Homebrew's full one); swift test
    # plays through the Swift package's frame driver. The Flutter steps run
    # only for changes to the plugin.
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true' ||
      needs.changes.outputs.flutter == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: needs.changes.outputs.flutter == 'true'
        with:
          channel: stable
      - name: Install tools
        # meson builds dav1d into FFmpeg (tool/build_ffmpeg.sh).
        run: brew install meson nasm ninja pkg-config
      - name: FFmpeg cache key
        id: ffmpeg
        run: |
          inputs="$(cat tool/build_ffmpeg.sh tool/apple_framework.sh; grep -E '^(ffmpeg|mbedtls|dav1d)_' tool/release.sh; xcodebuild -version)"
          echo "key=ffmpeg-apple-$(echo "$inputs" | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/ffmpeg
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Build the xcframeworks
        run: tool/release.sh build apple build-sources
      - name: Regression with the shipped FFmpeg
        # Homebrew's ffmpeg only generates the media; installed after the
        # shipped FFmpeg is built, so that build cannot find it.
        run: |
          brew install ffmpeg pkg-config
          NO_HW=1 FFMPEG_ROOT=third_party/ffmpeg/macos-arm64 tool/regression.sh
      - name: Swift package
        working-directory: sdk/apple
        run: swift test
      - name: Analyze
        if: needs.changes.outputs.flutter == 'true'
        working-directory: flutter
        run: flutter analyze
      - name: Build example
        if: needs.changes.outputs.flutter == 'true'
        working-directory: flutter/example
        run: LANG=en_US.UTF-8 flutter build macos --debug

  rust:
    # The crates build the core themselves (Homebrew's FFmpeg) and play
    # the media regression.sh generates.
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.abi == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: brew install ffmpeg ninja pkg-config
      - name: Media
        working-directory: .
        run: MEDIA_ONLY=1 tool/regression.sh
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Docs
        run: cargo doc --no-deps
