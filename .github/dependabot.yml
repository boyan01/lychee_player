# Proposes updates to the Actions the workflows pin by commit SHA (the
# comment after each pin names its release). FFmpeg, GLFW and Mbed TLS
# sources are pinned in tool/ scripts, which Dependabot cannot read; they
# follow Homebrew's FFmpeg major version (AGENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: monthly
  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /sdk/android
    schedule:
      interval: monthly
