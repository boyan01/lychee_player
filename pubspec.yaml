name: lychee_player
description: A cross-platform media player for Flutter, built on a reusable C/C++ core with hardware decoding.
version: 1.0.0-dev.0
repository: https://github.com/boyan01/lychee_player

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: LycheePlayerPlugin
        ffiPlugin: true
