name: lychee_player
description: A cross-platform media player for Flutter, built on a reusable C/C++ core with hardware decoding.
version: 1.0.0-beta.5
repository: https://github.com/boyan01/lychee_player

environment:
  sdk: ^3.5.0
  flutter: ">=3.35.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: tech.soit.lychee.lychee_player
        pluginClass: LycheePlayerPlugin
      ios:
        pluginClass: LycheePlayerPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        pluginClass: LycheePlayerPlugin
      macos:
        pluginClass: LycheePlayerPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      windows:
        pluginClass: LycheePlayerPluginCApi
