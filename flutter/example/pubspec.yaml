name: lychee_player_example
description: A responsive Lychee Player demo with desktop file drops.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  lychee_player:
    path: ../
  desktop_drop: ^0.9.2
  file_selector:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector

# Pin the complete cross_file 0.4 migration together until it is published.
# https://github.com/flutter/packages/pull/13147
# These are matching implementations, not a cross_file version override.
dependency_overrides:
  file_selector_platform_interface:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_platform_interface
  file_selector_android:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_android
  file_selector_ios:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_ios
  file_selector_linux:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_linux
  file_selector_macos:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_macos
  file_selector_web:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_web
  file_selector_windows:
    git:
      url: https://github.com/flutter/packages.git
      ref: 79f764c366bdbba0236958e3265db3967f33f8f1
      path: packages/file_selector/file_selector_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  ffi: ^2.1.0
  file_selector_platform_interface: ^3.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
